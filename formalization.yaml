fidelity:
  divergences: The mathematical parity/Vandermonde/nonsquare method is adapted from Lai-Sprang
    Section 3. Root moments are first formalised generically with explicit hypotheses; odd/filter
    stream identities require only N dividing p-1. The named support stream is not identified
    with the entire infinite rational-function Laurent sum. The original paper's full odd-characteristic
    counterexample theorem and this repository's terminal equivalence and boundary refinements
    are not formalised end to end. The named-stream cutoff d<N(3N/2-1) is formalised.
    The named-stream coefficient-row Proposition 2.3 and accepted-target-to-exact-certificate/product
    implication are now formalised; acceptance is still an explicit hypothesis.
    No first-formalisation claim is made. The combined package discharges
    root enumeration uniformly and exposes the odd coefficient sequence and geometric factor
    inside its independent statement; moment vanishing is still an explicit hypothesis.
