status:
  scope: Kernel-checked theorem groups are in theorem-catalogue.yaml. Source root enumeration
    and moment equations are explicit hypotheses of the rigidity theorem; RootStream separately
    proves enumeration and odd/filter identities for the named support stream. WindowMoments derives
    moments and the forced factor from finite parity windows with explicit row budgets. ParentWindow now derives
    the parity rows and degree budgets from an actual factored parent and proves the forced factor.
    DescentStep proves cancellation, exact child selection and iteration to d<N(N-1).
    TerminalGap proves support gaps and original-row terminal exclusion, strengthening the
    formal cutoff to d<N(3N/2-1). SparseDivisor proves the explicit degree-H sparse
    polynomial cannot divide X^(2H)+1 for dyadic H>=4, sigma^2=1, over fields with 2 nonzero;
    the actual-row antiperiodic convolution bridge is not formalised. Sharpness kernel-checks
    the F_5 counterexample to the all-degree N-bound (product 2^-8 for the actual polynomial
    and infinite named stream); ReverseLift proves certificate doubling from vanishing odd rows
    and the F_13 counterexample; FastCertificate proves a natural-number certificate checker
    sound, and the non-default SharpnessCertificates target applies it to p=29,37,53,61.
    TerminalLift proves geometric-factor odd-row annihilation, the all-row identity through scale N,
    and exact certificate/product transport uniformly in the prime. Its terminal certificate
    with j=deg S+2 is an explicit input, not an assumed existence theorem or Proposition 2.3.
    BoundaryRelation proves all-root data, odd-block factorisation, squaring transport,
    exact even/odd merges and natural-index parity reindexing; its generic recurrence
    hypotheses are discharged by the named stream identities. CorrelatedState proves exact
    paired-digit transitions, a finite state type and both directions of word reachability
    for the named stream. TargetPreimage proves the exact primitive-parts reduction of the
    zero-forcing root target for all four digit branches and the named infinite stream,
    plus a generic affine quotient criterion and representative independence. The actual
    child predicates are not yet packaged as affine subspaces; uniqueness has an explicit
    trivial-direction-intersection premise. BinomialNonvanishing proves the coefficient-row form of
    Lai-Sprang Proposition 2.3 for the infinite named stream, with full two-primary order and all shifts.
    TerminalDetection derives geometric nonvanishing by degree+2, proves the exact certificate endpoints,
    and connects actual accepted nonempty square targets to the existing product theorem. It also proves
    no invisible vectors for rows>=columns-1 without assuming Hankel invertibility. Dimensions,
    four-square reconstruction, concrete affine-direction intersection, executable enumeration and
    the sharper subspace cardinal bound remain outside Lean. Uniform acceptance remains an explicit
    missing existence theorem.
    Boundary cutoffs, exact shift localization, the
    other primes' sharpness witnesses, terminal dichotomy and characteristic-two
    construction are not Lean theorems of this project. Challenge.lean independently states
    a combined root-moment package; its deliberate statement placeholder is excluded from proof-development
    sorry counts.
