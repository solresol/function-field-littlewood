version: v0.4
project:
  name: Lai-Sprang coefficient identities and root-moment rigidity in Lean 4
  description: Formalises root-moment rigidity, the geometric forced-factor step, uniform root
    enumeration, the coefficient/root-sum identity, and finite parity-window-to-moment convolution
    and actual parent-window extraction for the explicit Lai-Sprang support stream.
    Includes generic exact and dual certificates and Laurent/product bridges. Complete leading-child
    selection, original-row terminal gap exclusion and iterated descent now prove the all-shift
    cutoff d<N(3N/2-1) in finite nonvanishing form. Also verifies the sparse-divisor
    obstruction used in the ordinary boundary localization argument, kernel-checked F_5 and
    F_13 multipliers whose Littlewood products are 2^-8, refuting the sharper auxiliary 2^-N
    bound, and the reverse lift of exact certificates. Also formalises the all-root
    boundary parity recurrence with exact rectangular and empty endpoints, and exact
    correlated eight-relation reachability under paired binary words. The uniform geometric-factor
    reverse lift transports exact terminal certificates to product 2^(-2N) at every allowed dyadic scale.
    The primitive target preimage criterion is proved for all four digit branches and the named stream,
    with a separate generic affine compatibility quotient theorem.
    Coefficient-row Proposition 2.3 is now proved by strict degree descent. Actual nonempty square
    target membership yields exact terminal certificates and polynomial product 2^(-2N), and the
    stacked Hankel/evaluation map has trivial kernel for rows>=columns-1.
  authors:
  - Greg Baker
  responsible_maintainers:
  - Greg Baker
  license: Apache-2.0
