  - 03B35
status:
  scope: Kernel-checked theorem groups are in theorem-catalogue.yaml. Source root enumeration
    and moment equations are explicit hypotheses of the rigidity theorem; RootStream separately
    proves enumeration and odd/filter identities for the named support stream. The full parent-window
    moment block, iterated degree cutoff, all-degree N-bound, terminal dichotomy and characteristic-two
    construction are not Lean theorems of this project. Challenge.lean independently states
    a combined root-moment package; its deliberate statement placeholder is excluded from proof-development
    sorry counts.
