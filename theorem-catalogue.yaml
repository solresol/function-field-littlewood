- id: dual-optimality
  title: Primal-dual optimum for all admissible multipliers
  status: kernel-checked
  mathematical_origin: verification foundation
  first_formalisation_priority: unestablished
  statement: Acceptance of a primal and dual certificate proves the exact first index and a
    nonzero coefficient by that index for every multiplier of the same degree and shift with
    both endpoints nonzero.
  assumptions:
  - Field with decidable equality; accepted checkOptimalCertificate.
  - Competing multiplier constant and leading coefficients are nonzero; its constant need not
    equal one.
  limitations: Fixed degree and shift only; diagnostic Gaussian-elimination ranks are not trusted
    and no global optimum is claimed.
  declarations:
  - name: FunctionFieldLittlewood.checkOptimalCertificate_sound_all
    file: FunctionFieldLittlewood/Normalisation.lean
    line_at_snapshot: 49
    introduced_commit: f60f3de939fa2fc97bbedd780231fce00a869476
    lean_type: |-
      FunctionFieldLittlewood.checkOptimalCertificate_sound_all.{u_1} {K : Type u_1} [Field K] {d : ℕ} [DecidableEq K]
        (a : ℕ → K) (R : Fin (d + 1) → K) (m j : ℕ) (w : Fin (j + 1) → K)
        (h : FunctionFieldLittlewood.checkOptimalCertificate a R m j w = true) :
        FunctionFieldLittlewood.FirstNonzero a R m j ∧
          ∀ (S : Fin (d + 1) → K),
            S 0 ≠ 0 → S (Fin.last d) ≠ 0 → ∃ k, 0 < k ∧ k ≤ j ∧ FunctionFieldLittlewood.fractionalCoeff a S m k ≠ 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
