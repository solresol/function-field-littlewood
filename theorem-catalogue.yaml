- id: finite-parity-windows
  title: Finite parity windows to root moments and forced factors
  status: kernel-checked
  mathematical_origin: source-based adaptation
  first_formalisation_priority: unestablished
  statement: Finite parity-row windows with exact support-aware degree budgets imply H consecutive
    root moments; for the named Lai-Sprang stream they force the next geometric factor.
  assumptions:
  - 'For windows_moments: arbitrary field, stream, H-root list and polynomials; the two finite parity
    systems and their explicit row budgets.'
  - 'For stream_windows_forced_factor: prime p>2, p-1=2*2^r*(2k+1), s divides 2^r, and the same windows
    in the actual support stream with g=factorQuotient F_p (2^r) s.'
  - The Lean r is one less than the valuation parameter. Zero polynomials and shifts are permitted;
    degree budgets apply only to nonzero filters.
  limitations: The original parent polynomial split, extraction of parity rows and degree budgets,
    leading-child bookkeeping and descent iteration remain unformalised. No all-degree bound or firstness
    claim.
  declarations:
  - name: FunctionFieldLittlewood.WindowMoments.windows_moments
    file: FunctionFieldLittlewood/WindowMoments.lean
    line_at_snapshot: 108
    introduced_commit: 931160ccf298f9d69c65f76d60e810b7a382ae24
    lean_type: |-
      @FunctionFieldLittlewood.WindowMoments.windows_moments : ∀ {K : Type u_1} [inst : Field K] {H : ℕ} (a : ℕ → K)
        (z : Fin H → K) (g U₀ U₁ : Polynomial K) (n delta A B : ℕ),
        (U₁ ≠ 0 → delta + H + U₁.natDegree ≤ A) →
          (U₀ ≠ 0 → H + U₀.natDegree ≤ B) →
            (∀ l < A,
                FunctionFieldLittlewood.WindowMoments.filt (g * U₀) a (n + l + 1) +
                    FunctionFieldLittlewood.WindowMoments.filt (g * U₁) (fun u => ∑ i, z i ^ u) (n + l + 1) =
                  0) →
              (∀ l < B,
                  FunctionFieldLittlewood.WindowMoments.filt (g * U₁) a (n + delta + l + 1) +
                      FunctionFieldLittlewood.WindowMoments.filt (g * U₀) (fun u => ∑ i, z i ^ u) (n + delta + l) =
                    0) →
                ∀ (k : Fin H),
                  ∑ i,
                      z i ^ (n + delta + ↑k) *
                        (Polynomial.eval (z i) g * (Polynomial.eval (z i) U₀ ^ 2 - z i * Polynomial.eval (z i) U₁ ^ 2)) =
