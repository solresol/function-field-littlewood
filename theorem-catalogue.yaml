- id: correlated-boundary-reachability
  title: Exact finite correlated boundary-state reachability
  status: kernel-checked
  mathematical_origin: formalisation of the 21 October ordinary structural lemma
  first_formalisation_priority: unestablished
  statement: The eight-relation tuple, root phase and saturated size close under paired binary digits.
    Reachability from the scalar initial tuple is equivalent to being the tuple of an actual nonnegative
    shift/size pair. The state type is finite over finite coefficients, and the infinite named Lai-Sprang
    stream discharges the generic recurrence hypotheses.
  assumptions:
  - Generic algebra uses a commutative ring and finite decidable root-coordinate type.
  - The generic closure theorem requires the even recurrence, weighted odd-root formula, root-squaring
    map, N>0 and all z^N=1; it does not assume the target transition identity.
  - The finite-state instance additionally requires finite coefficient and coordinate types.
  - The named-stream specialization assumes prime p and 2^(r+1) dividing p-1, not maximal valuation;
    Lean r=0 includes the usual valuation-r=1 case.
  limitations: Uses raw coefficients, not a formal normalized-stream coordinate equivalence. No Proposition
    2.3, injectivity/dimension theorem, terminal interpretation, executable enumeration, sharper
    subspace cardinal bound, uniform acceptance, new prime or characteristic-two advance. The finite
    type contains arbitrary predicate relations; no practical complexity claim.
  declarations:
  - name: FunctionFieldLittlewood.CorrelatedState.finiteState
    file: FunctionFieldLittlewood/CorrelatedState.lean
    line_at_snapshot: 137
    introduced_commit: 914c91f6cc97fb48e428f8218664274152fdb3a1
    lean_type: |-
      @FunctionFieldLittlewood.CorrelatedState.finiteState : ∀ {K : Type u_1} {Ω : Type u_2} {N : ℕ} [Finite K] [Finite Ω],
        Finite (FunctionFieldLittlewood.CorrelatedState.State K Ω N)
