- id: laurent-coefficient-bridge
  title: Actual Laurent coefficients and certificate transport
  status: kernel-checked
  mathematical_origin: verification foundation
  first_formalisation_priority: unestablished
  statement: The shifted polynomial-Laurent product has exactly the finite convolution coefficients,
    and a certificate gives its first positive nonzero coefficient.
  assumptions:
  - Commutative semiring; natural shift and coefficient index.
  - Certificate transport requires an ExactCertificate.
  limitations: The coordinate is x=t^(-1). The fractional part excludes the constant term; the
    generic bridge does not identify an external named series.
