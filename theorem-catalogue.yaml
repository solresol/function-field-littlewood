        (∀ (l : ℕ), a (2 * l) = a l) →
          (∀ (l : ℕ), a (2 * l + 1) = ∑ q, w q * z q ^ l) →
            (∀ (q : Ω), z (σ q) = z q ^ 2) →
              ∀ {N : ℕ} (hN : 0 < N),
                (∀ (x : Ω), z x ^ N = 1) →
