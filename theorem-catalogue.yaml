- id: named-binary-recurrences
  title: Binary digit-parity stream recurrences
  status: kernel-checked
  mathematical_origin: known recurrence formalised for regression
  first_formalisation_priority: unestablished
  statement: The binary digit-parity stream satisfies a_(2n)=a_n and a_(2n+1)=1+a_n for every
    natural n.
  assumptions:
  - The repository definition of binary digit parity in ZMod 2.
  limitations: Thue-Morse is retired as a counterexample candidate. This catalogue entry is
    a regression; no new candidate or dyadic all-scale Lean theorem is claimed.
  declarations:
  - name: FunctionFieldLittlewood.thueMorse_even
    file: FunctionFieldLittlewood/BinaryStream.lean
    line_at_snapshot: 21
    introduced_commit: cdff75f0e350dda809467d8822924b042f11e0eb
    lean_type: |-
      FunctionFieldLittlewood.thueMorse_even (n : ℕ) :
        FunctionFieldLittlewood.thueMorse (2 * n) = FunctionFieldLittlewood.thueMorse n
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
  - name: FunctionFieldLittlewood.thueMorse_odd
    file: FunctionFieldLittlewood/BinaryStream.lean
    line_at_snapshot: 27
    introduced_commit: cdff75f0e350dda809467d8822924b042f11e0eb
    lean_type: |-
      FunctionFieldLittlewood.thueMorse_odd (n : ℕ) :
        FunctionFieldLittlewood.thueMorse (2 * n + 1) = 1 + FunctionFieldLittlewood.thueMorse n
    axioms:
    - propext
    - Classical.choice
