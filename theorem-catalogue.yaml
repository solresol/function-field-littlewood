- id: sparse-divisor-obstruction
  title: Uniform sparse-divisor obstruction by reflection
  status: kernel-checked
  mathematical_origin: formalisation of the 16 October ordinary first-strip algebraic obstruction
  first_formalisation_priority: unestablished
  statement: For H=2^(r+2), r>=0, over every field with 2 nonzero, a+2X+sum_(i=0)^r X^(2^(i+1))+sigma
    X^H does not divide X^(2H)+1 when sigma^2=1.
  assumptions:
  - K is a field and (2:K) is nonzero; characteristic zero is also allowed.
  - r is any natural number, H=2^(r+2), N=2H. For the admissible stream r is the usual valuation
    parameter minus three.
  - a is arbitrary and sigma^2=1. No nonzero constant term, field-size relation, root list, finite
    fixture or version of the target is assumed.
  limitations: Verification/infrastructure progress on existing mathematics. The actual-row antiperiodic
    convolution bridge and complete two-residue localization are not formalised by this theorem.
    No new cutoff, all-degree bound, characteristic-two construction or priority claim. N=4 is excluded.
  declarations:
  - name: FunctionFieldLittlewood.SparseDivisor.sparse_eq_sum
    file: FunctionFieldLittlewood/SparseDivisor.lean
    line_at_snapshot: 22
    introduced_commit: 417116c79e25edefcc9ecb9b1bcc9edaca1b1f84
    lean_type: |-
      @FunctionFieldLittlewood.SparseDivisor.sparse_eq_sum : ∀ {K : Type u_1} [inst : Field K] (r : ℕ) (a σ : K),
        FunctionFieldLittlewood.SparseDivisor.sparse r a σ =
          Polynomial.C a + Polynomial.C 2 * Polynomial.X + ∑ i ∈ Finset.range (r + 1), Polynomial.X ^ 2 ^ (i + 1) +
            Polynomial.C σ * Polynomial.X ^ 2 ^ (r + 2)
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
  - name: FunctionFieldLittlewood.SparseDivisor.reflection_product
    file: FunctionFieldLittlewood/SparseDivisor.lean
    line_at_snapshot: 114
    introduced_commit: 417116c79e25edefcc9ecb9b1bcc9edaca1b1f84
    lean_type: |-
      @FunctionFieldLittlewood.SparseDivisor.reflection_product : ∀ {K : Type u_1} [inst : Field K] (f : Polynomial K)
        (H : ℕ),
        0 < H →
          Even H →
            f.natDegree = H →
              f.leadingCoeff ^ 2 = 1 →
                4 ≠ 0 →
                  f - f.comp (-Polynomial.X) = Polynomial.C 4 * Polynomial.X →
                    f ∣ Polynomial.X ^ (2 * H) + 1 → f * f.comp (-Polynomial.X) = Polynomial.X ^ (2 * H) + 1
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
  - name: FunctionFieldLittlewood.SparseDivisor.sparse_not_dvd
    file: FunctionFieldLittlewood/SparseDivisor.lean
    line_at_snapshot: 150
