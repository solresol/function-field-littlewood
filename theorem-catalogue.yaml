                          FunctionFieldLittlewood.ParityDescent.factorQuotient (ZMod p) (2 ^ r) s *
                              (Polynomial.X ^ 2 ^ r + 1) ∣
                            FunctionFieldLittlewood.ParityDescent.factorQuotient (ZMod p) (2 ^ r) s *
                              FunctionFieldLittlewood.ParentWindow.oddPart U
    axioms:
