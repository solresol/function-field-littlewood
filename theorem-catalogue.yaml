            ∀ j ≤ r + 2,
              ∀ (R : Polynomial (ZMod p)),
                R ≠ 0 →
                  FunctionFieldLittlewood.ParityDescent.factorQuotient (ZMod p) (2 ^ (r + 2)) (2 ^ j) ∣ R →
