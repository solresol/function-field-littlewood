      @FunctionFieldLittlewood.TerminalLift.geometric_eval_zero : ∀ {K : Type u_1} [inst : Field K] {N : ℕ}
        (P : Polynomial K),
        FunctionFieldLittlewood.ParityDescent.factorQuotient K N 1 ∣ P →
          ∀ (z : K), z ^ N = 1 → z ≠ 1 → Polynomial.eval z P = 0
