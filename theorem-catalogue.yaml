- id: reverse-lift-and-f13-sharpness
  title: Reverse lift of exact certificates and the F_13 refutation
  status: kernel-checked
  mathematical_origin: formalisation of the 5 October ordinary reverse lift in certificate form, applied
    to the 17 October p=13 witness
  first_formalisation_priority: unestablished
  statement: For any commutative ring and stream with a(2n)=a(n), if all odd rows of R vanish at every
    shift then an exact certificate for R at (m,j) gives one for R(t^2) at (2m,2j). For the named stream
    the odd coefficients have period 2^r in u, so odd-row vanishing reduces to residues. Over F_13 the
    lifted degree-316 multiplier at shift 5860 has exact index 324 and product 2^-8 < 2^-4.
  assumptions:
  - 'heven: a(2n)=a(n) for all n; hodd: every odd row of R vanishes, at every shift.'
  - 'For the F_13 instance: the 81-row terminal certificate and the 4 odd-row residues for S and S(t^2)
    are kernel-decided.'
  limitations: The odd-row condition is checked per instance by residues, not derived from divisibility
    by 1+X^H in general. Only p=5 (Sharpness.lean) and p=13 are formal; p=29,37,53,61 witnesses, least-degree
    covers and the sharpness corollary for all P remain outside Lean.
