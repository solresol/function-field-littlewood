- id: boundary-terminal-cutoffs
  status: ordinary-proof-not-lean
  statement: The degree-H boundary is excluded for all admissible primes at N=4,8,16,
    giving strict original cutoffs 24,96,384. The uniform gap lemma localizes possible
    degree-H terminal failures to floor((M+H)/N)=0 or -1 modulo H.
  record: results/2026-10-14-dyadic-gap.md
  remaining: The low-degree cutoff d<N(3N/2-1) is now Lean-proved in terminal-gap-cutoff.
    The exact last-support formula and shift localization, and the 12 October integer-minor
    boundary certificates, remain outside Lean. The exceptional strips are not excluded uniformly.
- id: terminal-equivalence
  status: ordinary-proof-not-lean
  statement: Terminal F_1 nonvanishing is equivalent to the all-degree N-bound, and the maximum
    defect is N or 2N.
  record: results/2026-10-05-terminal-lift.md
  remaining: On 17-18 October the 2N branch was selected for p=5,13,29,37,53,61 by explicit witnesses
    (all six in Lean, with the reverse lift formalised in certificate form); p=41 at N=8
    was computer-verified on 19 October but is not Lean-checked. Other N>=8 primes remain undecided. The uniform geometric-factor lift from exact terminal certificates is now Lean-proved
    in uniform-geometric-terminal-lift (24 October). Boundary acceptance to an exact certificate is now
    Lean-proved in binomial-nonvanishing-terminal-detection (29 October), using a proved coefficient-row
    Proposition 2.3. The descent-side equivalence and the full literature-dependent cap remain outside Lean.
