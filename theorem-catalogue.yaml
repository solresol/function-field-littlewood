            ∀ (R : Polynomial (ZMod p)),
              R ≠ 0 →
                Polynomial.X ^ (2 * 2 ^ r) - 1 ∣ R →
                  ∀ (m : ℕ),
                    ∃ j,
                      1 ≤ j ∧
                        j ≤ R.natDegree ∧
                          FunctionFieldLittlewood.WindowMoments.filt R (FunctionFieldLittlewood.laiSprangStream p (r + 1))
