theorems:
- id: root-moment-rigidity
  title: Root-moment rigidity and forced factors
  status: kernel-checked
  mathematical_origin: source-based adaptation
  first_formalisation_priority: unestablished
  statement: H consecutive weighted moments at H distinct roots of z^H=-1 force the geometric
    factor times X^H+1 to divide both parity children.
  assumptions:
  - Prime p>2; H>0; p-1=2H(2k+1); s divides H.
  - The H-root list is injective and every root satisfies z^H=-1.
  - The full H consecutive moment block vanishes; both quotient constant coefficients may be
    zero.
  limitations: The root list and moment equations are explicit hypotheses in this theorem. It
    does not derive them from a parent coefficient window or iterate descent.
  declarations:
  - name: FunctionFieldLittlewood.ParityDescent.geometric_parity_forced_factor
    file: FunctionFieldLittlewood/ParityDescent.lean
    line_at_snapshot: 162
    introduced_commit: 028d39736c66a345167b7bbd3f01cea980b8bfbe
    lean_type: |-
      FunctionFieldLittlewood.ParityDescent.geometric_parity_forced_factor {p H k s : ℕ} [Fact (Nat.Prime p)] (hp : 2 < p)
        (hH : 0 < H) (hs : s ∣ H) (horder : p - 1 = 2 * H * (2 * k + 1)) (z : Fin H → ZMod p) (hz : Function.Injective z)
        (hroot : ∀ (i : Fin H), z i ^ H = -1) (U₀ U₁ : Polynomial (ZMod p)) (n : ℕ)
        (hm :
          ∀ (j : Fin H),
            ∑ i,
                z i ^ (n + ↑j) *
                  (Polynomial.eval (z i) (FunctionFieldLittlewood.ParityDescent.factorQuotient (ZMod p) H s) *
                    (Polynomial.eval (z i) U₀ ^ 2 - z i * Polynomial.eval (z i) U₁ ^ 2)) =
              0) :
        FunctionFieldLittlewood.ParityDescent.factorQuotient (ZMod p) H s * (Polynomial.X ^ H + 1) ∣
            FunctionFieldLittlewood.ParityDescent.factorQuotient (ZMod p) H s * U₀ ∧
          FunctionFieldLittlewood.ParityDescent.factorQuotient (ZMod p) H s * (Polynomial.X ^ H + 1) ∣
            FunctionFieldLittlewood.ParityDescent.factorQuotient (ZMod p) H s * U₁
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
  evidence:
    proof_snapshot: a88a66bfbf75c98d279a45b40137bb5259718f10
    full_build: results/2026-10-06-lean-build.txt
    full_build_validation: results/2026-10-06-validation.json
    catalogue_audit: results/2026-10-07-catalogue-declarations.txt
    source_sha256:
      FunctionFieldLittlewood/ParityDescent.lean: 890c965d4aaef1650c4552f312a7eb6a67161a823a1581005a7f81cd1e974ea2
  archive:
    zenodo_version: 0.1.0
    zenodo_doi: 10.5281/zenodo.23117611
    note: Included in the frozen 3 October source archive.
  palomar:
    status: not-submitted
    id: null
- id: support-stream-root-formula
  title: Uniform roots and odd-coefficient identity
  status: kernel-checked
  mathematical_origin: known root-sum identity formalised
  first_formalisation_priority: unestablished
  statement: The support stream has a complete list of H roots of X^H+1, and its odd coefficients
    and all polynomial filters equal the corresponding root moments.
  assumptions:
  - Prime p; N=2^(r+1) divides p-1; H=2^r.
  - Every nonnegative coefficient/filter index and every polynomial, including zero, are covered.
  limitations: The Lean parameter r is one less than the usual valuation parameter. This does
    not identify the entire infinite rational-function Laurent sum. No maximal-valuation hypothesis
    is needed here.
  declarations:
  - name: FunctionFieldLittlewood.RootStream.stream_root_enumeration
    file: FunctionFieldLittlewood/RootStream.lean
    line_at_snapshot: 113
    introduced_commit: a88a66bfbf75c98d279a45b40137bb5259718f10
    lean_type: |-
      FunctionFieldLittlewood.RootStream.stream_root_enumeration {p r : ℕ} [Fact (Nat.Prime p)] (hd : 2 ^ (r + 1) ∣ p - 1) :
        ∃ z,
          Function.Injective z ∧
            (∀ (i : Fin (2 ^ r)), z i ^ 2 ^ r = -1) ∧
              (∀ (x : ZMod p), x ^ 2 ^ r = -1 ↔ ∃ i, x = z i) ∧
                ∀ (u : ℕ), FunctionFieldLittlewood.laiSprangStream p (r + 1) (2 * u + 1) = ∑ i, z i ^ u
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
  - name: FunctionFieldLittlewood.RootStream.stream_filtered_root_enumeration
    file: FunctionFieldLittlewood/RootStream.lean
    line_at_snapshot: 144
    introduced_commit: a88a66bfbf75c98d279a45b40137bb5259718f10
    lean_type: |-
      FunctionFieldLittlewood.RootStream.stream_filtered_root_enumeration {p r : ℕ} [Fact (Nat.Prime p)]
        (hd : 2 ^ (r + 1) ∣ p - 1) :
        ∃ z,
          Function.Injective z ∧
            (∀ (i : Fin (2 ^ r)), z i ^ 2 ^ r = -1) ∧
              ∀ (P : Polynomial (ZMod p)) (n : ℕ),
                ∑ j ∈ Finset.range (P.natDegree + 1),
                    P.coeff j * FunctionFieldLittlewood.laiSprangStream p (r + 1) (2 * (n + j) + 1) =
                  ∑ i, z i ^ n * Polynomial.eval (z i) P
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
  evidence:
    proof_snapshot: a88a66bfbf75c98d279a45b40137bb5259718f10
    full_build: results/2026-10-06-lean-build.txt
    full_build_validation: results/2026-10-06-validation.json
    catalogue_audit: results/2026-10-07-catalogue-declarations.txt
    source_sha256:
      FunctionFieldLittlewood/RootStream.lean: 4a2aa6203408396d8e7fbccbaead29c7629b65c447da7fac1e0ebde1a76cd25f
