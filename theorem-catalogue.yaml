- id: independent-root-moment-package
  title: Independent root enumeration and forced-factor package
  status: kernel-checked
  mathematical_origin: source-based adaptation and combination of existing formal steps
  first_formalisation_priority: unestablished
  statement: For every odd prime with p-1=2^(r+1)(2k+1) and s dividing 2^r, there is a complete
    root enumeration representing the explicit odd coefficients and all polynomial filters;
    a full H-moment block forces the geometric binomial factor into both parity children.
  assumptions:
  - Prime p>2; r,k,s natural; p-1=2^(r+1)(2k+1); s divides H=2^r.
  - The forced-factor implication assumes all H consecutive weighted moments vanish.
  - The coefficient sequence and geometric factor are concrete finite formulas inside the independent
    statement.
  limitations: This combines previously proved steps into a readable independent statement.
    It does not derive moments from a parent window or iterate descent, and does not settle
    an all-degree bound or claim novelty.
  declarations:
  - name: FunctionFieldLittlewood.Palomar.root_moment_package
    file: Solution.lean
    line_at_snapshot: 21
    introduced_commit: 15ca311e989d36ead9f7eaa99bc8537a2e41ae78
    lean_type: |-
      FunctionFieldLittlewood.Palomar.root_moment_package {p r k s : ℕ} [Fact (Nat.Prime p)] (hp : 2 < p)
        (horder : p - 1 = 2 ^ (r + 1) * (2 * k + 1)) (hs : s ∣ 2 ^ r) :
        have A := fun u => if u % 2 ^ r = 0 then ↑(2 ^ r) * (-1) ^ (u / 2 ^ r) else 0;
        have G := ∑ i ∈ Finset.range (2 ^ r / s), Polynomial.X ^ (s * i);
        ∃ z,
          Function.Injective z ∧
            (∀ (i : Fin (2 ^ r)), z i ^ 2 ^ r = -1) ∧
              (∀ (x : ZMod p), x ^ 2 ^ r = -1 ↔ ∃ i, x = z i) ∧
                (∀ (u : ℕ), A u = ∑ i, z i ^ u) ∧
                  (∀ (P : Polynomial (ZMod p)) (n : ℕ),
                      ∑ j ∈ Finset.range (P.natDegree + 1), P.coeff j * A (n + j) = ∑ i, z i ^ n * Polynomial.eval (z i) P) ∧
                    ∀ (U₀ U₁ : Polynomial (ZMod p)) (n : ℕ),
                      (∀ (j : Fin (2 ^ r)),
                          ∑ i,
                              z i ^ (n + ↑j) *
                                (Polynomial.eval (z i) G *
                                  (Polynomial.eval (z i) U₀ ^ 2 - z i * Polynomial.eval (z i) U₁ ^ 2)) =
                            0) →
                        G * (Polynomial.X ^ 2 ^ r + 1) ∣ G * U₀ ∧ G * (Polynomial.X ^ 2 ^ r + 1) ∣ G * U₁
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
  evidence:
    proof_snapshot: 15ca311e989d36ead9f7eaa99bc8537a2e41ae78
    lean_toolchain: leanprover/lean4:v4.35.0-rc2
    mathlib_commit: 065356127b1dc0016f66b7283ce0ce2c4055aa55
