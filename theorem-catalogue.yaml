- id: terminal-gap-cutoff
  title: Original-row terminal gap exclusion and stronger degree cutoff
  status: kernel-checked
  mathematical_origin: formalisation of the 9 October cutoff through the 14 October direct gap argument
  first_formalisation_priority: unestablished
  statement: For every odd prime and dyadic N>=4, any nonzero terminal quotient V with deg V<N/2
    has a nonzero original row by N+deg V at every shift. Under p-1=N(2k+1), the named stream has
    a nonzero row by d+N whenever d<N(3N/2-1).
  assumptions:
  - Prime p>2 and N=2^(r+2); Lean r is the valuation parameter minus two for the final cutoff.
  - Terminal nonvanishing requires only V nonzero and deg V<N/2, with arbitrary nonnegative shift;
    it does not require N dividing p-1.
  - The final cutoff additionally requires p-1=N(2k+1), R nonzero and d<N(N+N/2-1). No nonzero constant
    coefficient, finite fixture, pivot, gap or terminal target is assumed.
  limitations: Verification/infrastructure progress on existing ordinary mathematics. No stronger
    mathematical cutoff, all-degree N-bound, characteristic-two construction or priority claim. The
    exact degree-H shift localization, prime-independent boundary cutoffs and terminal equivalence
    remain outside this group. No new Laurent-product corollary.
  declarations:
  - name: FunctionFieldLittlewood.TerminalGap.terminal_nonvanishing
    file: FunctionFieldLittlewood/TerminalGap.lean
    line_at_snapshot: 237
    introduced_commit: ad99eeae946f1a948e6a49a69b1b92a75262459e
    lean_type: |-
      @FunctionFieldLittlewood.TerminalGap.terminal_nonvanishing : ∀ {p : ℕ} [inst : Fact (Nat.Prime p)],
        2 < p →
          ∀ (r : ℕ) (V : Polynomial (ZMod p)),
            V ≠ 0 →
              ∀ (M : ℕ),
                V.natDegree < 2 ^ (r + 1) →
                  ∃ k,
                    1 ≤ k ∧
                      k ≤ 2 ^ (r + 2) + V.natDegree ∧
                        FunctionFieldLittlewood.WindowMoments.filt
                            (FunctionFieldLittlewood.ParityDescent.factorQuotient (ZMod p) (2 ^ (r + 2)) 1 * V)
                            (FunctionFieldLittlewood.laiSprangStream p (r + 2)) (M + k) ≠
                          0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
  - name: FunctionFieldLittlewood.TerminalGap.terminal_degree_bound
    file: FunctionFieldLittlewood/TerminalGap.lean
    line_at_snapshot: 277
    introduced_commit: ad99eeae946f1a948e6a49a69b1b92a75262459e
    lean_type: |-
      @FunctionFieldLittlewood.TerminalGap.terminal_degree_bound : ∀ {p : ℕ} [inst : Fact (Nat.Prime p)],
        2 < p →
          ∀ (r : ℕ) (S : Polynomial (ZMod p)),
            S ≠ 0 →
              FunctionFieldLittlewood.ParityDescent.factorQuotient (ZMod p) (2 ^ (r + 2)) 1 ∣ S →
                ∀ (M : ℕ),
                  (∀ (i : ℕ),
                      1 ≤ i →
                        i ≤ S.natDegree + 1 →
                          FunctionFieldLittlewood.WindowMoments.filt S (FunctionFieldLittlewood.laiSprangStream p (r + 2))
                              (M + i) =
                            0) →
                    2 ^ (r + 2) + 2 ^ (r + 1) - 1 ≤ S.natDegree
    axioms:
