- id: binomial-nonvanishing-terminal-detection
  title: Coefficient-row Proposition 2.3 and exact terminal detection
  status: kernel-checked
  mathematical_origin: formalisation of Lai-Sprang Proposition 2.3 and the ordinary boundary arguments
    of 19/26 October
  first_formalisation_priority: unestablished
  statement: For the infinite named support stream, every nonzero X^N-1 multiple has a nonzero row by
    its degree at every shift. Every nonzero geometric multiple has a nonzero row by degree+2. Actual
    nonempty square target membership yields full degree, nonzero endpoints and an exact terminal certificate,
    then a polynomial product 2^(-2N). The stacked Hankel/evaluation map has trivial kernel whenever rows>=columns-1,
    including singular Hankel blocks.
  assumptions:
  - Prime p>2 and p-1=2*2^r*(2k+1), so N=2^(r+1) is the full two-primary part. Lean r=0 includes the usual
    valuation-r=1 comparison; all shifts are nonnegative.
  - Binomial nonvanishing requires a nonzero polynomial divisible by X^N-1. Geometric nonvanishing requires
    the factor F_N; no constant-coefficient premise is imposed.
  - Target detection takes actual membership of (0,e_1) in a square of size d+1, and an injective complete
    N-th-root list, supplied separately by the existing stream_full_root_data theorem. It assumes neither
    endpoints, exact degree, no invisible vectors nor Proposition 2.3.
  - No-invisible-vector theorem requires N distinct N-th roots, d+1 columns, L rows with d<=L, and both
    Hankel and evaluation outputs zero.
  limitations: Verification/infrastructure progress on known mathematics. Acceptance remains an explicit
    hypothesis; no uniform accepting word, new prime, characteristic-two construction, finite graph enumeration,
    dimension theorem, concrete affine-direction intersection, four-square theorem or even-shift stripping
    is supplied. The named support stream is not identified end to end with the full rational Laurent
    sum. This is not the full source theorem over arbitrary ground fields and irreducible P. No novelty,
    independent-kernel replay, archive or registry coverage is claimed.
  declarations:
  - name: FunctionFieldLittlewood.BinomialNonvanishing.stream_binomial_descent
    file: FunctionFieldLittlewood/BinomialNonvanishing.lean
    line_at_snapshot: 26
    introduced_commit: db1616b4757687cced5ad1bcb43d6e9157926e8f
    lean_type: |-
      @FunctionFieldLittlewood.BinomialNonvanishing.stream_binomial_descent : ∀ {p r k : ℕ} [inst : Fact (Nat.Prime p)],
        2 < p →
          p - 1 = 2 * 2 ^ r * (2 * k + 1) →
            ∀ (R : Polynomial (ZMod p)),
              R ≠ 0 →
                Polynomial.X ^ (2 * 2 ^ r) - 1 ∣ R →
                  ∀ (q n epsilon delta : ℕ),
                    epsilon ≤ 1 →
                      delta ≤ 1 →
                        R.natDegree = 2 * q + epsilon →
                          (∀ (j : ℕ),
                              1 ≤ j →
                                j ≤ R.natDegree →
                                  FunctionFieldLittlewood.WindowMoments.filt R
                                      (FunctionFieldLittlewood.laiSprangStream p (r + 1)) (2 * n + delta + j) =
                                    0) →
                            ∃ S,
                              S ≠ 0 ∧
                                S.natDegree = q ∧
                                  Polynomial.X ^ (2 * 2 ^ r) - 1 ∣ S ∧
                                    ∀ (j : ℕ),
                                      1 ≤ j →
                                        j ≤ q →
                                          FunctionFieldLittlewood.WindowMoments.filt S
                                              (FunctionFieldLittlewood.laiSprangStream p (r + 1)) (n + epsilon * delta + j) =
                                            0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
  - name: FunctionFieldLittlewood.BinomialNonvanishing.stream_binomial_nonvanishing
    file: FunctionFieldLittlewood/BinomialNonvanishing.lean
