- id: iterated-degree-cutoff
  title: Complete parity descent and uniform degree cutoff
  status: kernel-checked
  mathematical_origin: source-based adaptation of the 2 October ordinary argument
  first_formalisation_priority: unestablished
  statement: A nonzero polynomial of degree d with d+N zero rows in the named Lai-Sprang stream has
    d>=N(N-1). Hence d<N(N-1) gives a nonzero row among 1,...,d+N at every nonnegative shift.
  assumptions:
  - Prime p>2, N=2^(r+1), p-1=N(2k+1); Lean r is one less than the usual valuation parameter.
  - The one-step theorem assumes s divides N/2, F_(2s) divides nonzero R, degree 2q+epsilon, shift
    2n+delta with epsilon,delta<=1, and d+2s zero rows. It concludes a nonzero F_s-multiple of degree
    q with q+s zero rows at shift n+epsilon*delta.
  - The final nonvanishing theorem assumes only the field/order conditions, R nonzero, arbitrary
    nonnegative shift and strict degree cutoff. No nonzero constant coefficient or terminal target
    is assumed.
  limitations: Verification/infrastructure progress, not a new mathematical bound. Stronger ordinary
    terminal cutoffs, all-degree N-bound and characteristic-two construction are not proved here.
    The iteration packages a degree inequality, not a final terminal witness. No new Laurent-product
    corollary or priority claim.
  declarations:
  - name: FunctionFieldLittlewood.DescentStep.stream_descent_step
    file: FunctionFieldLittlewood/DescentStep.lean
