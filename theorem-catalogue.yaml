- id: littlewood-product-bridge
  title: Littlewood product and finite nonvanishing equivalence
  status: kernel-checked
  mathematical_origin: verification foundation
  first_formalisation_priority: unestablished
  statement: For Q=t^m R with actual degree d and nonzero endpoints, the base-two Littlewood
    product is at least 2^(-N) exactly when a coefficient among 1,...,d+N is nonzero; an exact
    index j gives product 2^(d-j).
  assumptions:
  - Field; arbitrary stream; natural d,m,N.
  - R has nonzero constant and leading coefficients.
  - The exact-product corollary requires an ExactCertificate with index j.
  limitations: This is an equivalence, not a proof of a uniform lower bound. The explicit base-two
    size handles a zero fractional part; it is not an ambient norm instance.
  declarations:
  - name: FunctionFieldLittlewood.polynomialLittlewoodProduct_bound_iff
    file: FunctionFieldLittlewood/FractionalPart.lean
    line_at_snapshot: 187
    introduced_commit: 6367d4571e0a9f5f2c69f651e3d6da94e88f0935
    lean_type: |-
      FunctionFieldLittlewood.polynomialLittlewoodProduct_bound_iff.{u_2} {d : ℕ} {F : Type u_2} [Field F] (a : ℕ → F)
        (R : Fin (d + 1) → F) (m N : ℕ) (h0 : R 0 ≠ 0) (hd : R (Fin.last d) ≠ 0) :
        2 ^ (-↑N) ≤
            FunctionFieldLittlewood.polynomialLittlewoodProduct a
              (Polynomial.X ^ m * FunctionFieldLittlewood.multiplierPolynomial R) ↔
          ∃ k, 0 < k ∧ k ≤ d + N ∧ FunctionFieldLittlewood.fractionalCoeff a R m k ≠ 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
  - name: FunctionFieldLittlewood.certificate_polynomialLittlewoodProduct
    file: FunctionFieldLittlewood/FractionalPart.lean
    line_at_snapshot: 178
    introduced_commit: 6367d4571e0a9f5f2c69f651e3d6da94e88f0935
    lean_type: |-
      FunctionFieldLittlewood.certificate_polynomialLittlewoodProduct.{u_2} {d : ℕ} {F : Type u_2} [Field F] (a : ℕ → F)
        (R : Fin (d + 1) → F) (m j : ℕ) (h : FunctionFieldLittlewood.ExactCertificate a R m j) :
        FunctionFieldLittlewood.polynomialLittlewoodProduct a
            (Polynomial.X ^ m * FunctionFieldLittlewood.multiplierPolynomial R) =
          2 ^ (↑d - ↑j)
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
  evidence:
    proof_snapshot: a88a66bfbf75c98d279a45b40137bb5259718f10
    full_build: results/2026-10-06-lean-build.txt
    full_build_validation: results/2026-10-06-validation.json
    catalogue_audit: results/2026-10-07-catalogue-declarations.txt
    source_sha256:
