    zenodo_version: null
    zenodo_doi: null
    note: Introduced after v0.1.0; not included in that DOI.
  palomar:
    status: not-submitted
    id: null
- id: certificate-soundness
  title: Exact coefficient certificates and Hankel kernels
  status: kernel-checked
  mathematical_origin: verification foundation
  first_formalisation_priority: unestablished
  statement: A certificate proves the exact first positive nonzero coefficient; the finite vanishing-prefix
    equations are exactly a Hankel matrix kernel condition.
  assumptions:
  - Commutative semiring; arbitrary coefficient stream.
  - An ExactCertificate includes j>0, nonzero constant and leading multiplier coefficients,
    j-1 zero rows and a nonzero j-th row.
  limitations: Locality is through inclusive index m+d+j. A finite witness does not prove an
    all-degree bound.
  declarations:
  - name: FunctionFieldLittlewood.certificate_sound
    file: FunctionFieldLittlewood/Certificate.lean
    line_at_snapshot: 60
    introduced_commit: 0e1952f02373cbfdaecf7f542d61d299c2dc065d
    lean_type: |-
      FunctionFieldLittlewood.certificate_sound.{u_1} {K : Type u_1} [CommSemiring K] {d : ℕ} (a : ℕ → K)
        (R : Fin (d + 1) → K) (m j : ℕ) (h : FunctionFieldLittlewood.ExactCertificate a R m j) :
        FunctionFieldLittlewood.FirstNonzero a R m j
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
  - name: FunctionFieldLittlewood.hankel_kernel_iff
    file: FunctionFieldLittlewood/Certificate.lean
    line_at_snapshot: 31
    introduced_commit: 0e1952f02373cbfdaecf7f542d61d299c2dc065d
    lean_type: |-
      FunctionFieldLittlewood.hankel_kernel_iff.{u_1} {K : Type u_1} [CommSemiring K] {d : ℕ} (a : ℕ → K)
        (R : Fin (d + 1) → K) (m L : ℕ) :
        (FunctionFieldLittlewood.hankel a m d L).mulVec R = 0 ↔
          ∀ (row : Fin L), FunctionFieldLittlewood.fractionalCoeff a R m (↑row + 1) = 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
  evidence:
    proof_snapshot: a88a66bfbf75c98d279a45b40137bb5259718f10
    full_build: results/2026-10-06-lean-build.txt
    full_build_validation: results/2026-10-06-validation.json
    catalogue_audit: results/2026-10-07-catalogue-declarations.txt
    source_sha256:
