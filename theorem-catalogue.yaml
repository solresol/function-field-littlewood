    lean_type: |-
      @FunctionFieldLittlewood.SparseDivisor.sparse_not_dvd : ∀ {K : Type u_1} [inst : Field K] (r : ℕ) (a σ : K),
        2 ≠ 0 → σ ^ 2 = 1 → ¬FunctionFieldLittlewood.SparseDivisor.sparse r a σ ∣ Polynomial.X ^ (2 * 2 ^ (r + 2)) + 1
    axioms:
    - propext
    - Classical.choice
