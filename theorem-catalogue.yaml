- id: coupled-terminal-target-preimage
  title: Primitive target preimages and affine compatibility
  status: kernel-checked
  mathematical_origin: formalisation of the 26 October ordinary target reduction and generic linear algebra
  first_formalisation_priority: unestablished
  statement: The zero-forcing root target reduces exactly to two coupled child tests with free moments
    vanishing on squared-root coordinates. All four digit branches agree with actual named-stream Hankel
    target membership. Generic affine-slice intersection is equivalent to the zero difference class modulo
    the sum of directions; this class is representative-independent, with uniqueness conditional on trivial
    direction intersection.
  assumptions:
  - 'Generic root reduction: a field with 2 nonzero; a finite injective list of nonzero roots closed under
    negation; a squaring map with z(sigma q)=z(q)^2. Generic relation arguments are arbitrary predicates,
    with no invisible-kernel premise.'
  - Actual-block specialization additionally uses the even coefficient recurrence and weighted odd-root
    formula, both discharged for the infinite named stream.
  - 'Named-stream theorem: prime p, 2^(r+1) divides p-1. No maximality is needed; Lean r=0 includes the
    usual valuation-r=1 case.'
  - 'Affine quotient theorem: two specified direction submodules and their affine representatives. Uniqueness
    explicitly assumes their intersection is bottom.'
  limitations: Verification/infrastructure progress on existing ordinary mathematics. The actual reduced
    child predicates are not yet packaged as affine subspaces in Lean. No formal free-coordinate cardinality,
    four-square reconstruction, normalized-forcing simplification, no-invisible-vector theorem, Proposition
    2.3, exact-certificate interpretation, even-shift stripping, uniform accepting word, new prime decision
    or characteristic-two result is supplied. No independent-kernel replay or archive coverage.
  declarations:
