        2 ^ (r + 1) ∣ p - 1 →
          ∀ (P : Polynomial (ZMod p)),
            FunctionFieldLittlewood.ParityDescent.factorQuotient (ZMod p) (2 ^ (r + 1)) 1 ∣ P →
              ∀ (M : ℕ),
                FunctionFieldLittlewood.ExactCertificate (FunctionFieldLittlewood.laiSprangStream p (r + 1))
