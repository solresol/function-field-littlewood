    introduced_commit: a29effc281ad4d0f16a78b14f52ea0b0bf6a6ea1
    lean_type: |-
      @FunctionFieldLittlewood.DescentStep.stream_descent_step : ∀ {p r k s : ℕ} [inst : Fact (Nat.Prime p)],
        2 < p →
          s ∣ 2 ^ r →
            p - 1 = 2 * 2 ^ r * (2 * k + 1) →
              ∀ (R : Polynomial (ZMod p)),
                R ≠ 0 →
                  FunctionFieldLittlewood.ParityDescent.factorQuotient (ZMod p) (2 * 2 ^ r) (2 * s) ∣ R →
                    ∀ (q n epsilon delta : ℕ),
                      epsilon ≤ 1 →
                        delta ≤ 1 →
                          R.natDegree = 2 * q + epsilon →
                            (∀ (j : ℕ),
                                1 ≤ j →
                                  j ≤ R.natDegree + 2 * s →
                                    FunctionFieldLittlewood.WindowMoments.filt R
                                        (FunctionFieldLittlewood.laiSprangStream p (r + 1)) (2 * n + delta + j) =
                                      0) →
                              ∃ S,
                                S ≠ 0 ∧
                                  S.natDegree = q ∧
                                    FunctionFieldLittlewood.ParityDescent.factorQuotient (ZMod p) (2 * 2 ^ r) s ∣ S ∧
                                      ∀ (j : ℕ),
                                        1 ≤ j →
                                          j ≤ q + s →
                                            FunctionFieldLittlewood.WindowMoments.filt S
                                                (FunctionFieldLittlewood.laiSprangStream p (r + 1))
                                                (n + epsilon * delta + j) =
                                              0
    axioms:
