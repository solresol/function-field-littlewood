- id: uniform-geometric-terminal-lift
  title: Uniform dyadic terminal-certificate lift and product
  status: kernel-checked
  mathematical_origin: formalisation of the 5 October ordinary reverse-lift argument
  first_formalisation_priority: unestablished
  statement: For geometric-factor multiples, the all-row dyadic lift identity holds through scale N. Exact
    certificates transport both endpoints and first nonzero index; an exact terminal certificate j=deg
    S+2 yields the actual polynomial product 2^(-2N).
  assumptions:
  - Prime p; N=2^(r+1) divides p-1; H=2^r. Maximality of the dyadic valuation is unnecessary, and r=0
    includes the usual r=1 comparison.
  - The all-row identity assumes F_N=1+X+...+X^(N-1) divides S, 0<=s<=r+1 and any natural absolute row,
    including zero; S may be zero.
  - Certificate transport additionally assumes an endpoint-admissible exact certificate at a nonnegative
    shift; terminal_product assumes its exact first index is deg S+2.
  - The binomial odd-filter lemma instead requires X^H+1 divides S.
  limitations: Verification/infrastructure progress, not new sharpness mathematics. No existence of terminal
    certificates, boundary-target-to-exact-certificate interpretation, Proposition 2.3, global optimality
    cap, characteristic-two result or full rational-sum identification is proved or assumed as an axiom.
    No independent-kernel replay or archive coverage.
  declarations:
  - name: FunctionFieldLittlewood.TerminalLift.odd_filter_of_dvd
    file: FunctionFieldLittlewood/TerminalLift.lean
    line_at_snapshot: 23
    introduced_commit: 846e458e1bfc8e34ed1bd0cc7fdc40eb0bd76c8f
    lean_type: |-
      @FunctionFieldLittlewood.TerminalLift.odd_filter_of_dvd : ∀ {p r : ℕ} [inst : Fact (Nat.Prime p)],
        2 ^ (r + 1) ∣ p - 1 →
          ∀ (P : Polynomial (ZMod p)),
            Polynomial.X ^ 2 ^ r + 1 ∣ P →
              ∀ (w : ℕ),
                FunctionFieldLittlewood.WindowMoments.filt P
                    (fun u => FunctionFieldLittlewood.laiSprangStream p (r + 1) (2 * u + 1)) w =
                  0
    axioms:
