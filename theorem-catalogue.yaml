- id: polynomial-normalisation
  title: Scalar normalisation and actual polynomial endpoints
  status: kernel-checked
  mathematical_origin: verification foundation
  first_formalisation_priority: unestablished
  statement: Normalising by a nonzero constant preserves exact certificates; checked optima
    transfer to actual degree-d polynomials with nonzero constant coefficient.
  assumptions:
  - Field; nonzero multiplier constant for normalisation.
  - Polynomial optimum uses a checked primal-dual certificate, actual natDegree=d and nonzero
    coefficient zero.
  limitations: No Laurent norm or global defect bound follows from this group alone.
  declarations:
